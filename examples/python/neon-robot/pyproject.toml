[project]
name = "neon-robot"
version = "0.1.0"
description = "Neon-lit robot demo: animated SphereLights orbiting the robot-ovrtx scene."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.2.6; python_version < '3.14'",
    "numpy==2.4.2; python_version >= '3.14'",
    "ovrtx==0.2.0.280040",
    "pillow>=10.0.0",
    "rerun-sdk==0.29.0",
    "warp-lang>=1.9.0",
]
